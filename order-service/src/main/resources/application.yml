server:
  port: 8084
  tomcat.mbeanregistry.enabled: true

spring:
  application.name: order-service
  threads.virtual.enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db}
    username: ${DB_USERNAME:order_svc}
    password: ${DB_PASSWORD:order_pw}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC

management:
  endpoints.web.exposure.include: health,prometheus
  metrics.distribution.percentiles-histogram.http.server.requests: true

clients:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  connect-timeout: 2s
  read-timeout: 10s
