server:
  port: 8083
  tomcat.mbeanregistry.enabled: true

spring:
  application.name: inventory-service
  threads.virtual.enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:inventory_svc}
    password: ${DB_PASSWORD:inventory_pw}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC

management:
  endpoints.web.exposure.include: health,prometheus
  metrics.distribution.percentiles-histogram.http.server.requests: true

inventory:
  strategy: ${INVENTORY_STRATEGY:naive}
