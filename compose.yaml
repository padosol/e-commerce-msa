x-jwt-secret: &jwt-secret ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1536m

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter_pw
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64m

  user-service:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: user-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/user_db
      JWT_SECRET: *jwt-secret
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 640m

  product-service:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: product-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 640m

  inventory-service:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: inventory-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_db
      INVENTORY_STRATEGY: ${INVENTORY_STRATEGY:-naive}
      INVENTORY_OPTIMISTIC_MAX_RETRIES: ${INVENTORY_OPTIMISTIC_MAX_RETRIES:-0}
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 640m

  order-service:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: order-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_db
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 640m

  payment-service:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: payment-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/payment_db
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 640m

  gateway:
    build:
      context: .
      dockerfile: infra/service.Dockerfile
      args:
        MODULE: gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8084
      JWT_SECRET: *jwt-secret
      # 게이트웨이는 heap 448 MiB 에 heap 밖 메모리가 약 440 MiB 더 든다(1단계 5차 조건에서 측정한 최댓값 866 MiB).
      # 640m 에서는 그 차이만큼 swap 을 써서 GC·요청 처리가 멈췄다. heap 과 GC 는 그대로 두고 메모리만 늘린다.
      # MaxRAMPercentage 로 두면 heap 이 메모리 한도를 따라 커지므로 -Xmx 로 고정한다.
      JAVA_TOOL_OPTIONS: "-Xmx448m -XX:+UseSerialGC"
    memswap_limit: 1280m   # 메모리 한도와 같게 해서 swap 을 쓰지 않는다(넘으면 OOM 으로 드러난다)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1280m

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
